// Forces the server to turn off newer features and switch to an older style, simulating Zombie Horde 1.
// Exec this after host.cfg, e.g. `+exec host.cfg +exec classicmode.cfg`

// Hud
sv_zh2_forcehudskin 2
sv_zh2_shakehud false

// Weapons
sv_zh2_forceweaponskin 2

// Timers
sv_zh2_forcetimerskin 2

// Obituaries
sv_zh2_forceobituarydisplaymode 3

// Round flow
sv_zh2_showpickchance false
sv_zh2_noendmusic true
sv_zh2_allowmapvoting false
sv_zh2_initialpickmethod 1
sv_zh2_initialpickrememberlastmap true
sv_zh2_maxpaniccount 1

// Movement
sv_zh2_useantisr50 false
sv_zh2_disablepregamesprinting true

// Zombie teleporting
sv_zh2_allowmovingwhenzombieteleporting true
sv_zh2_maxzombieteleports 3

// Newer features
sv_zh2_enableblood false
sv_zh2_enabletracers false
sv_zh2_enabledamagefeedback false
sv_zh2_translucentallies false
sv_zh2_teamindicators false
sv_zh2_identifyplayers false
